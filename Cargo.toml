[workspace]
resolver = "3"
members = ["crates/notak-core", "crates/notak-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Anonym0os/notak"

[workspace.dependencies]
notak-core = { path = "crates/notak-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = { version = "3.0.0", features = ["serde"] }
eframe = "0.37.0"
dirs = "7.0.0"
