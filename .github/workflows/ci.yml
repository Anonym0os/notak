# Les mêmes vérifications qu'en local, plus la construction des deux éditions et de l'app de bureau.
# Les actions sont épinglées à un commit, comme partout : celles-ci tournent sur main, dont d'autres exécutions relisent
# le cache, et une étiquette se déplace (Dependabot propose les nouveaux commits).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      # Le serveur et ses essais tournent sous Node (node:sqlite, types retirés à la volée).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Après chaque construction : aucun hôte que l'application ne nommait pas (scripts/hotes.ts), par exemple une
      # dépendance mise à jour qui se mettrait à appeler un service.
      - name: Construire l'édition serveur
        run: bun run build && node scripts/hotes.ts apps/web/dist
      - name: Construire l'édition locale
        run: bun run build:locale && node scripts/hotes.ts apps/web/dist

  bureau:
    name: App de bureau (la coque)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Les bibliothèques de WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bureau/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bureau/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # La coque embarque l'application : il la faut construite pour compiler.
      - run: bun run build:bureau && node scripts/hotes.ts apps/web/dist-bureau
      - name: Compiler la coque et passer ses essais (navigation, droits)
        run: cargo test --locked --manifest-path apps/bureau/src-tauri/Cargo.toml
