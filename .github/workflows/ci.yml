# Les mêmes vérifications qu'en local, plus la construction des deux éditions.
name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      # Le serveur et ses essais tournent sous Node (node:sqlite, types retirés à la volée).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Construire l'édition serveur
        run: bun run build
      - name: Construire l'édition locale
        run: bun run build:locale
