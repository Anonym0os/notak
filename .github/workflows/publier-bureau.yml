# Publier Notak : une étiquette v* poussée (`bun run nouvelle-version 0.2.0`, puis `git push origin HEAD v0.2.0`)
# construit l'app de bureau pour macOS (Apple et Intel), Windows et Linux, signe chaque paquet de mise à jour, construit
# l'image du serveur (ghcr.io/anonym0os/notak:0.2.0, amd64 et arm64, avec son attestation de provenance), et prépare un
# BROUILLON de version sur GitHub. Les apps installées n'en voient rien tant que le brouillon n'est pas publié à la main :
# on télécharge, on essaie, puis « Publish release ». Les serveurs non plus : `latest` ne bouge qu'à la publication
# (annoncer-serveur.yml). La marche à suivre et le pourquoi : docs/MISES-A-JOUR.md.
#
# Ce qui protège la clé de signature :
# - elle ne vit que dans l'environnement « publication », que GitHub ne déverrouille qu'après l'accord d'une personne
#   (Required reviewers) et seulement pour une étiquette v* ;
# - GitHub ne remet un secret qu'à la tâche qui le nomme, et le garde en mémoire sur sa machine le temps de la tâche.
#   Les tâches qui font tourner le code des dépendances (installation, plugins de Vite, scripts de construction et
#   macros de Cargo) n'en nomment donc aucun : « compiler », sans environnement, rend des paquets non signés, et les
#   images n'ont l'environnement que pour l'accord. Seule « signer » nomme la clé, et n'installe ni ne compile rien :
#   la CLI de Tauri (prise d'npm à son numéro exact), les outils d'Apple et nos scripts y tournent, rien d'autre ;
# - « signer » n'ouvre que l'archive attendue : des fichiers ordinaires, aux noms attendus, sans lien ni chemin qui sorte ;
# - à côté de la clé, seulement des actions de GitHub (actions/*), épinglées à un commit, pas à une étiquette qu'on
#   pourrait déplacer ;
# - aucun cache entre les exécutions, pas même celui où setup-bun garde bun (`no-cache`) : un cache empoisonné par
#   une autre exécution n'entre pas dans un paquet signé ;
# - le jeton GitHub n'a que les droits dont chaque tâche a besoin, et une version déjà publiée ne se réécrit pas.
# Cela protège la clé, pas le binaire : une dépendance piégée changerait ce qu'elle compile. C'est bun.lock et Cargo.lock
# (`--frozen-lockfile`, `--locked`) qui fixent ce qui entre dans le binaire.
name: Publier Notak

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publier-${{ github.ref }}
  cancel-in-progress: false

env:
  CLI_TAURI: '@tauri-apps/cli@2.12.4'
  # En minuscules : le registre de GitHub n'en accepte pas d'autres.
  IMAGE: ghcr.io/anonym0os/notak

jobs:
  verifier:
    name: Vérifier la version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
          # Sans cache : setup-bun garde d'office bun dans celui de main, sous une clé que la CI de n'importe quel commit
          # de main peut écrire ; un bun changé là construirait ce que « signer » signe.
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: L'étiquette, le numéro de l'app et ses notes s'accordent
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Trois nombres, rien d'autre : ce numéro entre ensuite dans des noms de fichiers et d'images.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::« $GITHUB_REF_NAME » n'est pas une étiquette de version (vX.Y.Z)."
            exit 1
          fi
          # Une version publiée ne se refait pas : les apps et les serveurs l'ont vue. Un brouillon, si (un essai
          # qui a échoué) ; chaque tâche qui écrit le vérifie encore avant d'écrire.
          if [ "$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::error::v$version est déjà publiée : une version publiée ne se réécrit pas. Repartez d'un nouveau numéro."
            exit 1
          fi
          conf=$(node -p "require('./apps/bureau/src-tauri/tauri.conf.json').version")
          if [ "$version" != "$conf" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à la version de tauri.conf.json ($conf) : passez par bun run nouvelle-version."
            exit 1
          fi
          # Le serveur dit sa version d'après la toile : la même partout.
          paquet=$(node -p "require('./packages/tableau/package.json').version")
          notak=$(sed -n "s/^export const VERSION_NOTAK = '\(.*\)'$/\1/p" packages/tableau/src/version.ts)
          if [ "$paquet" != "$version" ] || [ "$notak" != "$version" ]; then
            echo "::error::packages/tableau dit $paquet et VERSION_NOTAK $notak, l'étiquette $version : passez par bun run nouvelle-version."
            exit 1
          fi
          node scripts/publication.ts notes "$version" > /dev/null
          cle=$(node -p "require('./apps/bureau/src-tauri/tauri.publication.json').plugins.updater.pubkey")
          if [ -z "$cle" ]; then
            echo "::error::Pas de clé publique dans tauri.publication.json : bun run bureau:cle (docs/MISES-A-JOUR.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Essais (sans ceux du serveur, qui ont leur propre CI)
        run: bunx vitest run packages apps/web scripts

  brouillon:
    name: Préparer le brouillon
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Un brouillon, que personne ne voit encore
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          node scripts/publication.ts notes "$VERSION" > notes.md
          if brouillon=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$brouillon" != true ]; then
              echo "::error::v$VERSION est déjà publiée : une version publiée ne se réécrit pas."
              exit 1
            fi
            echo "Le brouillon de v$VERSION existe déjà : les paquets s'y ajoutent."
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Notak $VERSION" --notes-file notes.md
          fi

  # Le code des dépendances tourne ici : aucun secret, aucun environnement, le dépôt en lecture seule. La configuration
  # de publication y est déjà : la coque embarque l'adresse et la clé publique des mises à jour.
  compiler:
    name: Compiler (${{ matrix.plateforme }})
    needs: verifier
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: macos-aarch64
            machine: macos-latest
            cible: aarch64-apple-darwin
          - plateforme: macos-x86_64
            machine: macos-latest
            cible: x86_64-apple-darwin
          - plateforme: linux-x86_64
            # La plus ancienne Ubuntu encore servie : l'AppImage tourne sur les systèmes qui ont au moins sa glibc.
            machine: ubuntu-22.04
            cible: x86_64-unknown-linux-gnu
          - plateforme: windows-x86_64
            machine: windows-latest
            cible: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.machine }}
    env:
      CIBLE: ${{ matrix.cible }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
          # Sans cache : setup-bun garde d'office bun dans celui de main, sous une clé que la CI de n'importe quel commit
          # de main peut écrire ; un bun changé là construirait ce que « signer » signe.
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust, pour la cible
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$CIBLE"
      - name: Les bibliothèques de WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Compiler (l'application web, puis Rust, à Cargo.lock près)
        run: |
          cd apps/bureau/src-tauri
          bunx "$CLI_TAURI" build --ci --no-bundle --target "$CIBLE" --config tauri.publication.json -- --locked
      # macOS : `tauri bundle` signe l'app pendant qu'il l'empaquette, il se fait donc dans « signer ». Ici, le binaire seul.
      - name: Le binaire, à empaqueter et signer plus loin (macOS)
        if: runner.os == 'macOS'
        # Sans les fichiers « ._ » de macOS, que « signer » refuserait.
        env:
          COPYFILE_DISABLE: 1
        run: tar -cf paquet.tar -C "apps/bureau/src-tauri/target/$CIBLE/release" notak-bureau
      # Linux et Windows : rien à signer pour le système (aucun certificat Windows n'est configuré ; `--no-sign` en
      # sauterait un), donc l'empaquetage se fait ici. Seuls les paquets de mise à jour se signent plus loin.
      - name: Empaqueter (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          cd apps/bureau/src-tauri
          bunx "$CLI_TAURI" bundle --ci --no-sign --target "$CIBLE" --config tauri.publication.json
      - name: Les paquets, à signer plus loin (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          bundle="apps/bureau/src-tauri/target/$CIBLE/release/bundle"
          shopt -s nullglob
          # Ceux que publie `scripts/publication.ts paquets`, et rien d'autre (pas les dossiers de travail de Tauri).
          paquets=()
          for f in "$bundle"/{appimage/*.AppImage,deb/*.deb,rpm/*.rpm,nsis/*-setup.exe,msi/*.msi}; do paquets+=("${f#"$bundle"/}"); done
          if [ ${#paquets[@]} -eq 0 ]; then
            echo "::error::Aucun paquet dans $bundle."
            exit 1
          fi
          # Des chemins relatifs : sous Windows, « D:\… » se lirait comme une machine distante.
          tar -cf paquet.tar -C "$bundle" "${paquets[@]}"
      # L'archive garde les droits d'exécution, que l'artefact perdrait.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquet-${{ matrix.plateforme }}
          path: paquet.tar
          if-no-files-found: error
          retention-days: 7

  # La clé arrive ici, après l'accord, et seulement ici : on ne fait que déballer, empaqueter (macOS), signer et déposer.
  signer:
    name: Signer (${{ matrix.plateforme }})
    needs: [verifier, brouillon, compiler]
    environment: publication
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: macos-aarch64
            machine: macos-latest
            cible: aarch64-apple-darwin
          - plateforme: macos-x86_64
            machine: macos-latest
            cible: x86_64-apple-darwin
          # Signer un paquet de mise à jour ne dépend pas du système : Linux pour les deux.
          - plateforme: linux-x86_64
            machine: ubuntu-latest
            cible: x86_64-unknown-linux-gnu
          - plateforme: windows-x86_64
            machine: ubuntu-latest
            cible: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.machine }}
    env:
      CIBLE: ${{ matrix.cible }}
      PLATEFORME: ${{ matrix.plateforme }}
      VERSION: ${{ needs.verifier.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Node pour nos scripts et la CLI de Tauri (npx) : pas de bun ici, ni d'action d'ailleurs à côté de la clé.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paquet-${{ matrix.plateforme }}
          path: ${{ runner.temp }}/paquet
      - name: Déballer, après avoir vérifié chaque entrée
        run: |
          archive="$RUNNER_TEMP/paquet/paquet.tar"
          if [ "$RUNNER_OS" = macOS ]; then
            dossier="apps/bureau/src-tauri/target/$CIBLE/release"
            attendu='^notak-bureau$'
          else
            dossier="apps/bureau/src-tauri/target/$CIBLE/release/bundle"
            attendu='^(appimage|deb|rpm|nsis|msi)/[^/]+$'
          fi
          # Des fichiers ordinaires, aux noms attendus : ni lien, ni dossier, ni « .. » qui écrirait ailleurs.
          tar -tvf "$archive" | while read -r droits _; do
            if [ "${droits:0:1}" != - ]; then
              echo "::error::L'archive contient autre chose qu'un fichier ($droits)."
              exit 1
            fi
          done
          tar -tf "$archive" | while read -r nom; do
            if ! [[ "$nom" =~ $attendu ]] || [[ "$nom" == *..* ]]; then
              echo "::error::Entrée inattendue dans l'archive : $nom"
              exit 1
            fi
          done
          mkdir -p "$dossier"
          tar -xf "$archive" -C "$dossier"
      - name: Rust, pour lire le projet (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$CIBLE"
      # macOS : `tauri bundle` signe l'app (le certificat Apple, s'il y en a un, sinon « ad hoc ») pendant qu'il
      # l'empaquette, puis signe le paquet de mise à jour. Il ne compile rien : il prend le binaire déballé. Avec le
      # certificat, l'app est signée par un développeur identifié et notariée, et macOS l'ouvre sans avertissement.
      # Sans lui, elle est signée « ad hoc » (tauri.publication.json) et macOS demande, à la première ouverture
      # seulement, de confirmer dans Réglages → Confidentialité et sécurité.
      - name: Empaqueter et signer (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque dans l'environnement « publication » (docs/MISES-A-JOUR.md)."
            exit 1
          fi
          # Une variable vide passerait pour un certificat : sans certificat, aucune ne reste.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "${!v}" ]; then unset "$v"; fi
          done
          [ -n "${APPLE_CERTIFICATE:-}" ] || echo "Pas de certificat Apple : signature ad hoc."
          cd apps/bureau/src-tauri
          npx --yes "$CLI_TAURI" bundle --ci --target "$CIBLE" --config tauri.publication.json
      - name: Signer les paquets de mise à jour (Linux, Windows)
        if: matrix.plateforme == 'linux-x86_64' || matrix.plateforme == 'windows-x86_64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque dans l'environnement « publication » (docs/MISES-A-JOUR.md)."
            exit 1
          fi
          cd "apps/bureau/src-tauri/target/$CIBLE/release/bundle"
          shopt -s nullglob
          # Les paquets que l'app sait installer d'elle-même, ceux que `tauri build` signerait.
          paquets=(appimage/*.AppImage deb/*.deb rpm/*.rpm nsis/*-setup.exe msi/*.msi)
          if [ ${#paquets[@]} -eq 0 ]; then
            echo "::error::Aucun paquet de mise à jour à signer."
            exit 1
          fi
          # Le numéro entre dans la signature : une annonce trafiquée ne fait pas passer ce paquet pour un autre.
          for p in "${paquets[@]}"; do npx --yes "$CLI_TAURI" signer sign --app-version "$VERSION" "$p"; done
      - name: Ranger les paquets sous des noms stables
        run: node scripts/publication.ts paquets "apps/bureau/src-tauri/target/$CIBLE/release/bundle" "$PLATEFORME" "$VERSION" livraison
      - name: Les déposer dans le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::v$VERSION n'est plus un brouillon : une version publiée ne se réécrit pas."
            exit 1
          fi
          gh release upload "v$VERSION" livraison/* --repo "$GITHUB_REPOSITORY" --clobber

  # L'image du serveur, construite sur chaque architecture : sharp et argon2 y compilent ou y prennent leur code natif.
  # Poussée sans étiquette (par son empreinte), puis réunie en une seule plus bas. Aucun secret : le jeton GitHub de
  # la tâche suffit à écrire dans le registre du dépôt.
  image-amd64:
    name: Image du serveur (amd64)
    needs: verifier
    environment: publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      empreinte: ${{ steps.construire.outputs.empreinte }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Construire et pousser
        id: construire
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container --name notak > /dev/null
          docker buildx build --platform linux/amd64 --build-arg NOTAK_VERSION="$VERSION" --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" --metadata-file image.json .
          empreinte=$(jq -r '."containerimage.digest"' image.json)
          [[ "$empreinte" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Pas d'empreinte pour l'image : $empreinte"; exit 1; }
          echo "empreinte=$empreinte" >> "$GITHUB_OUTPUT"

  image-arm64:
    name: Image du serveur (arm64)
    needs: verifier
    environment: publication
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      empreinte: ${{ steps.construire.outputs.empreinte }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Construire et pousser
        id: construire
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container --name notak > /dev/null
          docker buildx build --platform linux/arm64 --build-arg NOTAK_VERSION="$VERSION" --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" --metadata-file image.json .
          empreinte=$(jq -r '."containerimage.digest"' image.json)
          [[ "$empreinte" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Pas d'empreinte pour l'image : $empreinte"; exit 1; }
          echo "empreinte=$empreinte" >> "$GITHUB_OUTPUT"

  image:
    name: Image du serveur (x.y.z, les deux architectures)
    needs: [verifier, image-amd64, image-arm64]
    environment: publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Une seule étiquette pour les deux architectures
        id: reunir
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier.outputs.version }}
          AMD64: ${{ needs.image-amd64.outputs.empreinte }}
          ARM64: ${{ needs.image-arm64.outputs.empreinte }}
        run: |
          # L'étiquette x.y.z d'une version publiée est celle qu'ont attestée et tirée les serveurs : elle ne se déplace plus.
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::error::v$VERSION est déjà publiée : son image ne se remplace pas."
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          empreinte=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ json .Manifest }}' | jq -r .digest)
          [[ "$empreinte" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Pas d'empreinte pour $IMAGE:$VERSION"; exit 1; }
          echo "empreinte=$empreinte" >> "$GITHUB_OUTPUT"
      # Ce que vérifie `gh attestation verify oci://ghcr.io/anonym0os/notak:x.y.z -R Anonym0os/notak` : l'image vient
      # de ce dépôt, de cette étiquette et de ce workflow. Signée par GitHub (Sigstore), poussée à côté de l'image.
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.reunir.outputs.empreinte }}
          push-to-registry: true

  annoncer:
    name: Écrire l'annonce (latest.json)
    needs: [verifier, signer, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: latest.json, SHA256SUMS.txt et compose.yaml, une fois toutes les plateformes là
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::v$VERSION n'est plus un brouillon : son latest.json ne se réécrit pas."
            exit 1
          fi
          mkdir livraison
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir livraison --pattern 'Notak_*'
          # Le compose.yaml de cette étiquette, celui qui va avec son image (l'OpenFGA qu'ont lancé ses essais) : les
          # serveurs le reprennent à chaque mise à jour (releases/latest/download/compose.yaml, docs/AUTO-HEBERGER.md).
          cp compose.yaml livraison/
          node scripts/publication.ts annonce livraison "$VERSION" "$GITHUB_REPOSITORY"
          gh release upload "v$VERSION" livraison/latest.json livraison/SHA256SUMS.txt livraison/compose.yaml --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "## Notak $VERSION est en brouillon"
            echo
            echo "1. Téléchargez les paquets du brouillon, installez-les par-dessus la version d'avant et essayez-les. Le passage d'une"
            echo "   app installée à cette version, lui, ne s'essaie qu'après la publication (étape 4) : aucune app ne voit un brouillon."
            echo "2. L'image du serveur attend aussi : \`$IMAGE:$VERSION\` (elle n'est pas encore \`latest\`)."
            echo "3. Puis, sur la page du brouillon : **Publish release**. Les apps installées la verront à leur prochaine recherche,"
            echo "   et \`latest\` passera à cette version (annoncer-serveur.yml)."
            echo "4. Tout de suite après : sur une app de la version d'avant, *Rechercher maintenant* doit la trouver et l'installer."
            echo "   Sinon : docs/MISES-A-JOUR.md, « Si ça tourne mal »."
          } >> "$GITHUB_STEP_SUMMARY"
