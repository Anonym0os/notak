# L'app iOS, compilée pour le simulateur sur un Mac de GitHub, sans signature ni secret : la coque Rust pour
# aarch64-apple-ios-sim, le plugin Swift, le projet Xcode généré. Rien ne part vers Apple ici (la publication est la
# tâche `ios` de publier-bureau.yml, à venir avec docs/IOS.md phase 6).
#
# Lancée à la main (workflow_dispatch) tant que la phase 0 de docs/IOS.md n'est pas passée sur un vrai Mac : une CI
# iOS rouge avant d'avoir vu l'app tourner ne dirait rien d'utile. Puis sur push, sur les chemins de la coque.
name: iOS (simulateur)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLI_TAURI: '@tauri-apps/cli@2.12.4'

jobs:
  simulateur:
    name: Compiler pour le simulateur
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust, pour iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: bun install --frozen-lockfile
      - name: L'application embarquée
        run: bun run build:bureau && node scripts/hotes.ts apps/web/dist-bureau
      - name: Le plugin « appareil », sa partie Rust
        run: cargo test --locked --manifest-path apps/bureau/plugins/appareil/Cargo.toml
      - name: Le projet Xcode (généré s'il n'est pas commité)
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
        run: |
          cd apps/bureau/src-tauri
          [ -d gen/apple ] || bunx "$CLI_TAURI" ios init --ci
      - name: Compiler pour le simulateur, sans signature
        run: |
          cd apps/bureau/src-tauri/gen/apple
          # Tauri nomme le projet d'après l'app ; on lit le nom plutôt que de le supposer.
          projet=$(ls -d *.xcodeproj | head -1)
          nom=${projet%.xcodeproj}
          xcodebuild -project "$projet" -scheme "${nom}_iOS" -configuration debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
