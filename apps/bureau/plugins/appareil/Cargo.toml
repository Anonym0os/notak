[package]
name = "notak-appareil"
version = "0.1.0"
description = "Le plugin « appareil » de la coque Notak : ce qu'une page ne sait pas faire sur un iPhone ou un iPad (zones sûres, clavier, thème de la vue, photo de la fenêtre, retours haptiques), en Swift ; et, partout, dit à la page sur quoi elle tourne."
edition = "2021"
publish = false
links = "notak-appareil"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
