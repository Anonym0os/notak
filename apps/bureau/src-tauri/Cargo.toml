[package]
name = "notak-bureau"
version = "0.1.0"
description = "La coque de bureau de Notak : une fenêtre sur l'application web du serveur."
edition = "2021"
publish = false

[lib]
name = "notak_bureau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

# La photo de la fenêtre pour un signalement : `takeSnapshot` du WKWebView, l'image exacte de la page.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[profile.release]
# Une coque qui ne fait qu'ouvrir une fenêtre : on la veut petite.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
