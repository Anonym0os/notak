<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6feb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Notak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icones/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-180.png" />
    <title>Notak</title>
    <!-- L'écran d'attente, ici et non dans app.css : il se peint avant que le moindre script ou la moindre feuille de
         l'app n'arrive. React le remplace par le même écran (EcranAttente) tant que les toiles se chargent. -->
    <style>
      .ecran-attente {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ebedee;
      }
      .ecran-attente[data-theme='sombre'] {
        background: #1b1e23;
      }
      .ecran-attente::before {
        content: '';
        width: 64px;
        height: 64px;
        background: url('/icones/icone.svg') center / contain no-repeat;
      }
      /* La roue n'arrive qu'après une demi-seconde : un lancement rapide ne montre que l'icône. */
      .ecran-attente::after {
        content: '';
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        border: 2px solid rgb(50 59 74 / 0.18);
        border-top-color: #323b4a;
        border-radius: 50%;
        opacity: 0;
        animation:
          ecran-attente-roue 0.8s linear infinite,
          ecran-attente-apparition 0.3s ease-out 0.5s forwards;
      }
      .ecran-attente[data-theme='sombre']::after {
        border-color: rgb(227 229 233 / 0.2);
        border-top-color: #e3e5e9;
      }
      @keyframes ecran-attente-roue {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ecran-attente-apparition {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ecran-attente::after {
          animation-duration: 3s, 0.3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="racine"><div class="ecran-attente" aria-busy="true"></div></div>
    <script src="/demarrage.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
