# Les en-têtes de sécurité de chaque réponse, tirés de entetesSecurite("site") (packages/tableau/src/securite.ts).
# nginx oublie les add_header du serveur dans un location qui en pose : chaque location inclut ce fichier.
add_header x-content-type-options "nosniff" always;
add_header x-frame-options "DENY" always;
add_header referrer-policy "strict-origin-when-cross-origin" always;
add_header cross-origin-opener-policy "same-origin" always;
add_header permissions-policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header strict-transport-security "max-age=31536000" always;
