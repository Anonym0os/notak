# notak.app : l'application (une page unique) et ses fichiers. Aucune API : tout se passe dans le navigateur.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Les fichiers construits portent leur empreinte dans leur nom : ils ne changent jamais.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Le service worker et le manifeste se relisent à chaque fois : c'est par eux qu'arrive une nouvelle version.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # Le partage vers Notak (PWA) arrive en POST : le service worker le reçoit ; sans lui, on revient à l'accueil.
  location = /partage {
    if ($request_method = POST) {
      return 303 /;
    }
    try_files /index.html =404;
  }

  location /a-propos {
    try_files $uri $uri/ /a-propos/index.html;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Toute autre adresse (/t/<tableau>, /rapide…) est l'application elle-même.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
