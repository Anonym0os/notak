# notak.app : l'application (une page unique) et ses fichiers. Aucune API : tout se passe dans le navigateur.
# Les en-têtes de sécurité (entetes.conf) et la CSP de l'application (csp.conf) viennent de
# packages/tableau/src/securite.ts ; un essai vérifie qu'ils n'ont pas dérivé. nginx oublie les add_header du serveur
# dès qu'un location en pose un : chaque location les inclut donc lui-même.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Les fichiers construits portent leur empreinte dans leur nom : ils ne changent jamais.
  location /assets/ {
    include /etc/nginx/notak/entetes.conf;
    include /etc/nginx/notak/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Le service worker et le manifeste se relisent à chaque fois : c'est par eux qu'arrive une nouvelle version.
  location = /sw.js {
    include /etc/nginx/notak/entetes.conf;
    include /etc/nginx/notak/csp.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/notak/entetes.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # Le partage vers Notak (PWA) arrive en POST : le service worker le reçoit ; sans lui, on revient à l'accueil.
  location = /partage {
    include /etc/nginx/notak/entetes.conf;
    include /etc/nginx/notak/csp.conf;
    if ($request_method = POST) {
      return 303 /;
    }
    try_files /index.html =404;
  }

  # La page « À propos » est une page fixe, sans rien de personne dedans : son script en ligne ne demande que le
  # nombre d'étoiles du dépôt à GitHub.
  location /a-propos {
    include /etc/nginx/notak/entetes.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /a-propos/index.html;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Toute autre adresse (/t/<tableau>, /rapide…) est l'application elle-même.
  location / {
    include /etc/nginx/notak/entetes.conf;
    include /etc/nginx/notak/csp.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
