<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notak</title>
    <meta name="description" content="Notak, des tableaux visuels libres. Prochainement." />
    <meta name="theme-color" content="#eef0f2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 16px;
        box-sizing: border-box;
        background: #eef0f2 radial-gradient(#c4c8ce 1px, transparent 1px) center / 20px 20px;
        color: #1f2328;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      h1 { margin: 0; font-size: clamp(64px, 18vw, 220px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
      p { margin: 0; font-size: clamp(17px, 2.2vw, 22px); color: #59636e; }
      a { font-size: 15px; color: #2f6feb; text-decoration: none; font-weight: 600; }
      a:hover { text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <h1>Notak</h1>
    <p>Prochainement.</p>
    <a href="https://github.com/Anonym0os/notak">Le code sur GitHub</a>
  </body>
</html>
