# La CSP de l'application, tirée de politiqueContenu("site") (packages/tableau/src/securite.ts) ; un essai vérifie
# qu'elles sont identiques. Le navigateur refuse toute requête vers un autre hôte que ceux-ci.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://nominatim.openstreetmap.org; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://www.dailymotion.com https://fast.wistia.net https://www.tiktok.com https://open.spotify.com https://w.soundcloud.com https://embed.music.apple.com https://widget.deezer.com https://maps.google.com https://www.google.com https://www.openstreetmap.org https://www.figma.com https://miro.com https://codepen.io https://docs.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
