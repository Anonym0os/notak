# Un serveur Notak à soi (docs/AUTO-HEBERGER.md). Derrière un relais HTTPS : Caddy, Traefik, Coolify…
#
# Deux services : Notak, et OpenFGA qui évalue ses droits. OpenFGA ne tient qu'une copie : la vérité est dans la base
# de Notak, et un magasin OpenFGA perdu se refait au démarrage. Son stockage SQLite évite seulement de tout renvoyer.
#
# Les réglages vivent dans un fichier .env, à côté de celui-ci, une ligne par variable :
#
#   NOTAK_ORIGINE=https://notak.exemple.fr
#   NOTAK_ADMINS=vous@exemple.fr
#
# Chaque ligne arrive au serveur (la liste : docs/AUTO-HEBERGER.md, « Les variables »). Une variable placée devant la
# commande (`NOTAK_X=… docker compose up -d`) ne vaut que pour cette commande : la mise à jour suivante l'oublie.
#
# L'image est celle que publie le dépôt, pour amd64 et arm64. Mettre à jour : docker compose pull && docker compose up -d
# (la base est copiée avant chaque migration). Construire depuis les sources :
#   docker compose -f compose.yaml -f compose.source.yaml up -d --build
services:
  notak:
    # `latest` suit les versions publiées ; `NOTAK_VERSION=0.2.0` dans le .env s'y tient.
    image: ghcr.io/anonym0os/notak:${NOTAK_VERSION:-latest}
    restart: unless-stopped
    # Sur la boucle locale de la machine : le relais qui tourne sur elle (Caddy) joint Notak, le reste du réseau non.
    # Ouvert à tous, le port laisserait n'importe qui écrire lui-même X-Forwarded-For, que le serveur croit. Un relais
    # sur une autre machine, ou dans un conteneur qui passe par la machine : NOTAK_ECOUTE=0.0.0.0 (ou l'adresse de
    # l'interface voulue) dans le .env, et un pare-feu qui ne laisse passer que lui. Docker contourne souvent ufw.
    ports:
      - '${NOTAK_ECOUTE:-127.0.0.1}:${NOTAK_PORT:-3005}:3005'
    # Compose 2.24 ou plus récent. Sans .env, les défauts ci-dessous et ceux de l'image.
    env_file:
      - path: .env
        required: false
    # Seulement ce qui a besoin d'une valeur ici : `environment` l'emporte sur le .env (sauf à passer par `${…}`).
    environment:
      # L'adresse publique du serveur, telle qu'on la tape (https://notak.exemple.fr) : liens envoyés, retours de
      # connexion, et l'adresse que l'app de bureau attend. Le défaut ne sert qu'à un essai sur sa machine.
      NOTAK_ORIGINE: ${NOTAK_ORIGINE:-http://localhost:3005}
      NOTAK_OPENFGA_URL: http://openfga:8080
      # Derrière un relais HTTPS (l'image règle les deux à `1`) : cookies `Secure`, et l'adresse du client lue dans
      # X-Forwarded-For, l'entrée qu'y ajoute le relais (`2` : deux relais l'un derrière l'autre). Pour un essai en
      # HTTP sur sa machine, les deux à `0` dans le .env.
      #   NOTAK_COOKIE_SECURISE=1
      #   NOTAK_RELAIS=1
    volumes:
      - notak-donnees:/donnees
    depends_on:
      - openfga

  openfga-migration:
    # La même version que les essais du serveur (vitest.openfga.ts) : un essai le vérifie.
    image: openfga/openfga:v1.22.0
    command: migrate --datastore-engine sqlite --datastore-uri file:/home/nonroot/openfga.db
    volumes:
      - openfga:/home/nonroot

  openfga:
    image: openfga/openfga:v1.22.0
    restart: unless-stopped
    command: run --datastore-engine sqlite --datastore-uri file:/home/nonroot/openfga.db --playground-enabled=false
    volumes:
      - openfga:/home/nonroot
    depends_on:
      openfga-migration:
        condition: service_completed_successfully

volumes:
  notak-donnees:
  openfga:
