# Notak et OpenFGA, qui évalue ses droits. OpenFGA ne tient qu'une copie : la vérité est dans la base de Notak, et
# un magasin OpenFGA perdu se refait au démarrage. Son stockage SQLite évite seulement de tout renvoyer à chaque fois.
#
#   NOTAK_ORIGINE=https://notak.exemple.fr docker compose up -d
#
# Devant, un relais HTTPS (cookies `Secure`, adresse du client lue dans X-Forwarded-For) qui passe aussi les WebSocket.

services:
  openfga-migration:
    image: openfga/openfga:v1.22.0
    command: migrate --datastore-engine sqlite --datastore-uri file:/home/nonroot/openfga.db
    volumes:
      - openfga:/home/nonroot

  openfga:
    image: openfga/openfga:v1.22.0
    command: run --datastore-engine sqlite --datastore-uri file:/home/nonroot/openfga.db --playground-enabled=false
    volumes:
      - openfga:/home/nonroot
    depends_on:
      openfga-migration:
        condition: service_completed_successfully
    restart: unless-stopped

  notak:
    build: .
    ports:
      - "${NOTAK_PORT:-3005}:3005"
    environment:
      NOTAK_OPENFGA_URL: http://openfga:8080
      NOTAK_ORIGINE: ${NOTAK_ORIGINE:-http://localhost:3005}
    volumes:
      - notak-donnees:/donnees
    depends_on:
      - openfga
    restart: unless-stopped

volumes:
  notak-donnees:
  openfga:
